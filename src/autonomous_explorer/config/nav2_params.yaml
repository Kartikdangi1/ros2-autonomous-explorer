# Nav2 Parameters — autonomous_explorer
# Holonomic 4WD mecanum robot (0.5m × 0.3m chassis)
# Replaces: custom OccupancyMapper, AStarPlanner, TrajectoryController, LocalCostmap
# Depends on: SLAM Toolbox for /map + map→odom TF,
#             robot_localization EKF for odom→base_link TF

# ===========================================================================
# Global Costmap — static-window, map frame
# Replaces: OccupancyMapper + AStarPlanner inflation
# ===========================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0      # reduced from 5.0 — fewer updates during StaticLayer resizes
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link

      # Must match SLAM Toolbox resolution (slam_toolbox_params.yaml: resolution: 0.05)
      # The static_layer inherits the incoming map resolution, so mismatching
      # causes silent override and inconsistent costmap sizing.
      resolution: 0.05
      rolling_window: false
      # true = treat unexplored (unknown) cells as unknown during planning.
      # With allow_unknown: true in SmacPlanner2D the planner can still route
      # through unknown space, but the costmap won't silently treat unobserved
      # walls as free, preventing the planner from routing the robot into walls
      # it hasn't seen yet and then hitting them.
      track_unknown_space: true

      # Allow TF lookups up to 0.5 s old for the costmap's own pose lookups.
      transform_tolerance: 1.0

      # Robot footprint — bounding box of 0.5m×0.3m chassis
      robot_radius: 0.0
      footprint: "[[0.25, 0.15], [0.25, -0.15], [-0.25, -0.15], [-0.25, 0.15]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      # Keeps the costmap in sync with the SLAM Toolbox map topic
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true

      # Replaces OccupancyMapper's raycasting + update_with_scan_points
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: fused_scan
        fused_scan:
          topic: /fused_scan
          sensor_frame: lidar_link
          observation_persistence: 0.0
          expected_update_rate: 0.0
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_range: 19.0   # match max_range param
          raytrace_range: 20.0
          inf_is_valid: true
          transform_tolerance: 1.0
          # Clear the robot's own footprint from the obstacle layer so short-range
          # self-returns from the chassis don't mark the robot's cell as lethal.
          footprint_clearing_enabled: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Shallower decay widens the repulsion gradient; cost at 0.6 m from wall
        # rises from ~79 to ~105, pushing SmacPlanner2D paths further from obstacles.
        cost_scaling_factor: 2.5
        # 0.30 m > circumscribed radius (0.292 m) so robot corner never reaches wall
        # when following a path at the inflation boundary.  0.20 m was too small:
        # robot corner (0.292 m) extended 0.09 m past the 0.20 m boundary → wall hit.
        inflation_radius: 0.30
        inflate_unknown: false


# ===========================================================================
# Local Costmap — rolling window, odom frame
# Replaces: LocalCostmap class (5×5m, 0.05m resolution, 0.30m inflation)
# ===========================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0   # match local_costmap_update_rate
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link

      # 0.05 m/cell matches RL training (84×84 × 0.05 = 4.2 m FOV).
      # 5 m window → 100×100 cells; covers DWB sim_time lookahead (2.5 s × 0.8 m/s = 2.0 m).
      # Finer resolution gives DWB a 6-cell-deep inflation gradient (was 2–3 cells at 0.12 m)
      # so it can accurately sense wall proximity and steer away before contact.
      # NOTE: width/height are integer metres in nav2_costmap_2d; do not use floats (SIGABRT).
      resolution: 0.05
      width: 5
      height: 5
      rolling_window: true
      track_unknown_space: false

      footprint: "[[0.25, 0.15], [0.25, -0.15], [-0.25, -0.15], [-0.25, 0.15]]"
      robot_radius: 0.0
      transform_tolerance: 1.0

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: fused_scan
        fused_scan:
          topic: /fused_scan
          sensor_frame: lidar_link
          observation_persistence: 0.0
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_range: 5.0
          raytrace_range: 6.0
          inf_is_valid: true
          transform_tolerance: 1.0
          footprint_clearing_enabled: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 2.5
        # 0.30 m > circumscribed radius (0.292 m).
        # DWB BaseObstacle critic uses this cost to steer away from walls in real-time.
        inflation_radius: 0.30


# ===========================================================================
# Planner Server — global A* path planner
# Replaces: AStarPlanner + _douglas_peucker + OccupancyMapper.get_inflated_grid
# ===========================================================================
planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    expected_planner_frequency: 0.0  # 0 = no frequency check; BT RateController drives replanning

    GridBased:
      # SmacPlanner2D: A* on a 2D costmap with proper footprint collision checking
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5             # match goal_tolerance
      use_astar: true            # A* (not Dijkstra)
      allow_unknown: true        # explore through unmapped areas
      max_planning_time: 1.0
      max_iterations: 200000     # 100k timed out on 504×497 maps; 1M causes OOM segfault
      smooth_path: true          # built-in path smoothing
      downsample_costmap: false
      downsampling_factor: 1
      cost_travel_multiplier: 3.5   # prefers open corridors but still routes through 0.9m gaps


# ===========================================================================
# Controller Server — holonomic path follower
# Replaces: TrajectoryController + LocalCostmap reactive avoidance
# ===========================================================================
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0   # match control_rate
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0    # reduced from 5.0 — faster failure declaration (0.3 s at 10 Hz)
    speed_limit_topic: "speed_limit"   # nav2_msgs/SpeedLimit from path_speed_limiter_node
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    # Replaces stuck_timeout (20→10 s) — now handled by Nav2 progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10   # small — just confirm the robot is nudging
      movement_time_allowance: 20.0    # 20 s: tolerates up to 1 resize stall (500 ms) with margin

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3          # must match training_config.yaml goal_tolerance and rl_params.yaml
      yaw_goal_tolerance: 1.57        # holonomic: don't care about final heading
      stateful: true

    # DWB — Holonomic Dynamic Window Approach
    # Replaces: TrajectoryController.compute_velocity (P-gain + strafe logic)
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # Holonomic base — enables lateral (vy) velocity commands.
      # NOTE: both params needed: holonomic_robot in DWBLocalPlanner AND
      # kinematics.holonomic in StandardTrajectoryGenerator (Nav2 Humble).
      holonomic_robot: true
      kinematics.holonomic: true   # trajectory generator param — without this vy is never sampled

      # Velocity limits — mecanum wheels allow up to 1.0 m/s
      max_vel_x: 0.8
      max_vel_y: 0.6             # lateral for holonomic
      min_vel_x: -0.5
      min_vel_y: -0.5
      max_vel_theta: 1.5
      min_vel_theta: -1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.8
      min_speed_theta: 0.0

      # Acceleration limits — increased to reach higher speeds quickly
      acc_lim_x: 3.0
      acc_lim_y: 3.0
      acc_lim_theta: 3.5
      decel_lim_x: -3.0
      decel_lim_y: -3.0
      decel_lim_theta: -3.5

      # Trajectory sampling — 15×12×15 = 2700 trajectories
      # vy_samples doubled: lateral movement IS the escape route for a holonomic robot
      # sim_time reduced: shorter horizon is more reactive in tight corridors;
      # covers 2.5 s × 0.8 m/s = 2.0 m which fits the 4.5 m local costmap
      vx_samples: 15
      vy_samples: 12
      vtheta_samples: 15
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      trans_stopped_velocity: 0.05

      # Goal tolerance — must match training_config.yaml goal_tolerance and rl_params.yaml
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 1.57        # holonomic: final heading irrelevant
      transform_tolerance: 2.0        # was 1.0 — covers momentary SLAM TF stalls
      short_circuit_trajectory_evaluation: true

      # DWB critics (cost functions that replaced reactive strafing logic)
      # NOTE: RotateToGoal removed — it is for differential-drive only.
      # On a holonomic robot it forces spinning in place within xy_goal_tolerance
      # (0.8 m) instead of translating, triggering SimpleProgressChecker every time.
      critics: ["Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]

      # Holonomic-optimised critic weights:
      # - PathAlign/GoalAlign reduced: heading alignment doesn't apply to a robot that crab-walks
      # - PathDist/GoalDist raised: primary navigation objective
      # - BaseObstacle raised 16×: near-wall cost (≈253×2.5=633) now far exceeds path-deviation
      #   penalty (24×0.2m=4.8), so DWB strongly prefers sidestepping over wall-following
      PathAlign.scale: 6.0
      PathAlign.forward_point_distance: 0.5
      GoalAlign.scale: 4.0
      GoalAlign.forward_point_distance: 0.5
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      BaseObstacle.scale: 2.5
      Oscillation.scale: 10.0

    # ── MPPI — Model Predictive Path Integral (alternative to DWB) ────────────
    # To activate: change controller_plugins above to ["MPPIFollowPath"]
    # MPPI samples thousands of trajectory rollouts and picks the best.
    # Handles dynamic obstacles better, smoother output, GPU-acceleratable.
    # motion_model: Omni = holonomic (Mecanum wheels can strafe).
    MPPIFollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_max: 0.5
      vx_min: -0.3
      vy_max: 0.5
      vy_min: -0.5
      wz_max: 1.5
      iteration_count: 1
      prune_distance: 1.5
      transform_tolerance: 2.0
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      critics:
        ["ConstraintCritic", "GoalCritic", "GoalAngleCritic",
         "ObstaclesCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.10
        near_goal_distance: 0.5
        inflation_radius: 0.30
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        mode: 0


# ===========================================================================
# Behavior Server — recovery behaviors
# Replaces: NBVSPLAMNode._recovery() 3-phase escape maneuver
# ===========================================================================
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    wait:
      plugin: "nav2_behaviors/Wait"

    # Limits for recovery behaviors
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0   # was 0.1 — Ignition sim-time TF can lag; 0.1 caused Spin/BackUp to abort
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    # Linear velocity limits — required for BackUp behavior (DriveOnHeading)
    # Without these, BackUp logs "no acceleration limits set" and aborts immediately.
    # NOTE: DriveOnHeading reads "linear_acc_lim" (NOT "linear_acceleration_lim").
    max_linear_vel: 0.3
    min_linear_vel: 0.05
    linear_acc_lim: 2.5


# ===========================================================================
# BT Navigator — orchestrates planner + controller + recovery via BT XML
# Replaces: SPLAMState machine + control_loop() + periodic replan timer
# ===========================================================================
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered  # EKF output

    # Custom exploration BT (replaces the 6-state SPLAM state machine)
    # NOTE: the launch file overrides this with an absolute path via
    # {'default_bt_xml_filename': BT_XML} — this value is only a fallback
    # and should NOT be used as a bare filename (it won't resolve correctly).
    # The launch-file override always wins, so this value is never actually used.
    default_bt_xml_filename: "exploration_bt.xml"  # overridden by nav2_exploration.launch.py

    # Replaces replan_interval (25→15 s) — BT RateController handles replanning
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose"]

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node


# ===========================================================================
# Lifecycle Manager — autostart for all Nav2 servers
# ===========================================================================
lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
