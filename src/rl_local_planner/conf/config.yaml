# Hydra training config — single source of truth for all training hyperparams.
# Override any field on the CLI: python train_ppo.py sim=mujoco num_envs=8
# Hydra auto-saves the resolved config to outputs/<date>/<time>/.hydra/

# ── Runtime (CLI overrides, not saved to model card) ─────────────────────────
sim: mujoco          # gazebo | mujoco | point2d
seed: 42
num_envs: 1
resume_from: null    # path to checkpoint .zip to resume from (no .zip extension)

# ── PPO hyperparameters ──────────────────────────────────────────────────────
policy: MultiInputPolicy
learning_rate: 3.0e-4
n_steps: 2048
batch_size: 64
n_epochs: 5
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.02
vf_coef: 0.5
max_grad_norm: 0.5
total_timesteps: 1500000

# ── Network architecture ─────────────────────────────────────────────────────
features_dim: 128          # output dim of the custom feature extractor
net_arch_pi: [256, 256]    # policy network hidden layers
net_arch_vf: [256, 256]    # value network hidden layers

# ── Normalisation ────────────────────────────────────────────────────────────
normalize_reward: true     # VecNormalize wrapper for reward stabilisation

# ── Evaluation ───────────────────────────────────────────────────────────────
eval_freq: 25000           # run eval every N training steps
n_eval_episodes: 10        # episodes per evaluation round

# ── Checkpointing ────────────────────────────────────────────────────────────
checkpoint_freq: 50000     # save model every N steps
tb_log_dir: "./tb_logs/"
save_dir: "./rl_checkpoints/"
best_model_dir: "./rl_best_model/"

# ── Reward weights ───────────────────────────────────────────────────────────
reward_progress: 5.0
reward_goal_reached: 25.0
reward_collision: -5.0
reward_proximity: -0.5
reward_smoothness: -0.1
reward_step_cost: -0.03
reward_heading: 0.2
reward_near_goal: 5.0
reward_near_goal_radius: 0.8
reward_proximity_threshold: 0.5
goal_tolerance: 0.3
