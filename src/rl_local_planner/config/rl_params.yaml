# RL controller node parameters — inference time
rl_controller:
  ros__parameters:
    # Path to the exported ONNX model
    model_path: "/home/kartik/ros2-autonomous-explorer/models/explorer_ppo.onnx"

    # Inference rate (Hz) — matches MuJoCo training step rate (0.05s = 20 Hz)
    inference_rate: 20.0

    # Carrot-point extraction: max distance along global path for local goal.
    # Adaptive: shrinks below carrot_narrow_threshold to avoid wall-skipping in corridors.
    carrot_radius: 3.0
    carrot_min_scale: 0.35        # minimum fraction of carrot_radius in tight corridors
    carrot_narrow_threshold: 1.5  # metres — below this LiDAR min, start shrinking

    # Velocity limits (must match obs_builder.py MAX_VEL_X/Y used during training)
    max_vel_x: 0.5
    max_vel_y: 0.5
    max_vel_theta: 1.5

    # Acceleration limits (must match nav2_params.yaml)
    max_accel_x: 3.0
    max_accel_y: 3.0
    max_accel_theta: 3.5

    # Safety: emergency stop if min LiDAR range drops below this (metres).
    # 0.22 m: must be > inscribed_radius (0.15 m) + SLAM cell (0.05 m) = 0.20 m
    # so Gazebo overshoot doesn't push the robot into INSCRIBED costmap space
    # ("Starting point in lethal space"). 0.30 m was too high — in corners
    # walls are within 0.30 m on multiple sides and the robot froze permanently.
    safety_min_range: 0.22

    # Goal tolerance — must match training_config.yaml goal_tolerance and nav2_params.yaml xy_goal_tolerance
    goal_tolerance: 0.3

    # Observation costmap size (must match training)
    costmap_size: 84
